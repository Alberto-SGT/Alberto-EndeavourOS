[colors]
background = #282A2E
background-alt = #1a2a3a
foreground = #e8c9a0
primary = #c94a1a
secondary = #2a7a8a
alert = #e85a1a
disabled = #4a4a5a

[bar/example]
width = 100%
height = 24pt
radius = 6

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 3

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:size=11;2"

modules-left = xworkspaces filesystem cpu memory 
modules-right = brightness pulseaudio battery wlan eth powermenu
modules-center = spotify date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = [%name%]
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%% 󰋊

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = custom/script
interval = 1

date = %d/%m/%Y
time = %H:%M
#date-alt = %Y-%m-%d %H:%M:%S

label = %output%
label-foreground = ${colors.primary}
click-right = /usr/bin/firefox --new-tab "https://calendar.google.com" &
exec = date "+%d/%m/%Y %H:%M"

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
[module/powermenu]
type = custom/text
label = ⏻
click-left = rofi -show power-menu -modi "power-menu:rofi-power-menu"

[module/brightness]
type = internal/backlight
card = amdgpu_bl1
enable-scroll = true
label = 󰃞 %percentage%%
scroll-up = ~/.config/i3/scripts/brightness.sh up
scroll-down = ~/.config/i3/scripts/brightness.sh down

[module/spotify]
type = custom/text
label = 
click-left = spotify &

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 98
poll-interval = 5

format-charging = <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>

label-charging = 󰂄 %percentage%%
label-discharging = %percentage%%
label-full = 󰁹 %percentage%%

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁾
ramp-capacity-4 = 󰁹

ramp-capacity-0-foreground = #F38BA8
ramp-capacity-1-foreground = #F38BA8
ramp-capacity-2-foreground = #F9E2AF
ramp-capacity-3-foreground = #F9E2AF
ramp-capacity-4-foreground = #A6E3A1

label-charging-foreground = #A6E3A1
label-full-foreground = #A6E3A1
